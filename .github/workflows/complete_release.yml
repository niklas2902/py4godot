name: complete release

on:
  workflow_dispatch:     # Allows manual triggering

permissions:
  contents: read

concurrency:
  group: complete-release-${{ github.ref }}
  # A release run should not be killed by a second manual trigger.
  cancel-in-progress: false

env:
  PY4GODOT_PYTHON: "3.11.3"
  # Version of the CPython distribution that build.py bundles into build/py4godot/
  BUNDLED_CPYTHON: "3.14.4"

jobs:
  build:
    runs-on: ubuntu-latest
    container: niklas2902/py4godot:4.6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          # `branch:` is not an input of actions/checkout -- it was silently
          # ignored and you got the default branch instead.
          ref: 'android-game'

      # If the container image already ships 3.11.3, you can drop this step
      # entirely -- setup-python inside a container replaces the interpreter
      # the image was built around.
      - name: Set up Python ${{ env.PY4GODOT_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY4GODOT_PYTHON }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Print structure
        run: python meson_scripts/print_tools.py

      - name: Generate files
        run: python generate.py

      - name: Cythonize
        run: python cythonize_files.py

      - name: Upload Precompiled Code
        uses: actions/upload-artifact@v4
        with:
          name: precompiled
          include-hidden-files: true
          path: |
            .
            !.git
            !.git/**
          retention-days: 1
          if-no-files-found: error

  build_cpp:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            platform: linux64
          - os: windows-latest        # was ubuntu-latest -- MSVC/pwsh steps cannot run on Linux
            target: windows
            platform: windows64
          - os: macos-latest
            target: macos
            platform: darwin64
          - os: ubuntu-24.04-arm
            target: linux-arm
            platform: linuxarm64

    steps:
      - name: Download Precompiled Code
        uses: actions/download-artifact@v4
        with:
          name: precompiled

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY4GODOT_PYTHON }}

      # upload-artifact does not preserve the executable bit, so anything the
      # build shells out to comes back from the artifact as mode 644.
      - name: Restore executable bits
        if: matrix.target != 'windows'
        shell: bash
        run: |
          find . -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} + || true

      - name: Install dependencies and build for Linux (Ubuntu)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install meson ninja
          python build.py --target_platform=linux64 --compiler=gcc

      - name: Set up MSVC environment
        if: matrix.target == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Godot
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ "User-Agent" = "actions"; "Authorization" = "Bearer $env:GH_TOKEN" }
          $release = Invoke-RestMethod "https://api.github.com/repos/godotengine/godot/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "Godot_v*_win64.exe.zip" } | Select-Object -First 1
          Write-Host "Installing $($release.tag_name)"

          $dir = "$env:RUNNER_TEMP\godot"
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" -DestinationPath $dir

          $main    = Get-ChildItem $dir -Filter "Godot_v*_win64.exe" | Where-Object { $_.Name -notlike "*_console*" } | Select-Object -First 1
          $console = Get-ChildItem $dir -Filter "Godot_v*_win64_console.exe" | Select-Object -First 1
          Rename-Item $main.FullName "godot.exe"
          Rename-Item $console.FullName "godot_console.exe"
          Add-Content $env:GITHUB_PATH $dir

      - name: Check
        if: matrix.target == 'windows'
        shell: pwsh
        run: godot_console --version

      - name: Install dependencies and build for Windows (native)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install meson ninja
          python build.py --target_platform=windows64 --compiler=msvc -run_tests=True

      - name: Install dependencies and build (Ubuntu ARM64)
        if: matrix.target == 'linux-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install meson ninja
          python build.py --target_platform=linuxarm64 --compiler=gcc

      - name: Install dependencies and build (macOS)
        if: matrix.target == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config sdl2
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install meson ninja flake8
          python build.py --target_platform=darwin64 --compiler=clang

      # ---- numpy goes into the *bundled* interpreter, not the build venv ----
      # Must run before the upload so numpy ships inside the artifact.
      - name: Install numpy into bundled interpreter (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          PYDIR="build/py4godot/cpython-${BUNDLED_CPYTHON}-${{ matrix.platform }}/python"
          PYBIN="$PYDIR/bin/python3"
          if [ ! -x "$PYBIN" ]; then
            echo "Interpreter not found at $PYBIN -- contents of build/py4godot:"
            ls -la build/py4godot || true
            exit 1
          fi
          chmod +x "$PYBIN"
          # Bootstrap pip the same way the project does elsewhere: get-pip.py,
          # not ensurepip (these trimmed bundles may not ship ensurepip at all).
          curl -fsSL -o "$RUNNER_TEMP/get-pip.py" https://bootstrap.pypa.io/get-pip.py
          "$PYBIN" "$RUNNER_TEMP/get-pip.py"
          "$PYBIN" -m pip --version
          "$PYBIN" -m pip install --no-warn-script-location numpy
          "$PYBIN" -c "import numpy; print('numpy', numpy.__version__, 'in', numpy.__file__)"

      - name: Install numpy into bundled interpreter (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyDir = "build/py4godot/cpython-$env:BUNDLED_CPYTHON-${{ matrix.platform }}/python"
          # python-build-standalone puts python.exe at the root on Windows,
          # but fall back to bin/ in case the layout differs.
          $pyBin = Join-Path $pyDir "python.exe"
          if (-not (Test-Path $pyBin)) { $pyBin = Join-Path $pyDir "bin/python.exe" }
          if (-not (Test-Path $pyBin)) {
            Write-Host "Interpreter not found under $pyDir -- contents of build/py4godot:"
            Get-ChildItem "build/py4godot" -Recurse -Depth 2 | Select-Object FullName
            throw "python.exe not found"
          }
          # Bootstrap pip via get-pip.py, not ensurepip.
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:RUNNER_TEMP\get-pip.py"
          & $pyBin "$env:RUNNER_TEMP\get-pip.py"
          if ($LASTEXITCODE -ne 0) { throw "get-pip.py failed" }
          & $pyBin -m pip --version
          & $pyBin -m pip install --no-warn-script-location numpy
          if ($LASTEXITCODE -ne 0) { throw "numpy install failed" }
          & $pyBin -c "import numpy; print('numpy', numpy.__version__, 'in', numpy.__file__)"
          if ($LASTEXITCODE -ne 0) { throw "numpy import check failed" }

      - name: Upload py4godot build artifact
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: py4godot-${{ matrix.target }}
          path: build/py4godot/**
          retention-days: 30
          if-no-files-found: error

  combine:
    needs: build_cpp
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: py4godot-*
          merge-multiple: true
          path: py4godot/install_dir/addons/py4godot

      - name: Check out LICENSE
        uses: actions/checkout@v4
        with:
          sparse-checkout: LICENSE
          sparse-checkout-cone-mode: false
          path: license-checkout

      - name: Add LICENSE
        run: cp license-checkout/LICENSE py4godot/install_dir/addons/py4godot/LICENSE

      - name: Upload Zipped Artifact
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: py4godot
          path: py4godot
          if-no-files-found: error